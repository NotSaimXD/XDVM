name: Build Windows release

on:
	push:
		tags:
			- 'v*.*.*'

permissions:
	contents: write

jobs:
	build-windows:
		runs-on: windows-latest
		steps:
			- name: Check out source
				uses: actions/checkout@v4
			- name: Set up Node.js
				uses: actions/setup-node@v4
				with:
					node-version: 22
					cache: npm
			- name: Install dependencies
				run: npm install
			- name: Bundle QEMU for Windows
				shell: pwsh
				run: |
					choco install qemu -y --no-progress
					$qemu = (Get-Command qemu-system-x86_64.exe).Source
					New-Item -ItemType Directory -Force resources/qemu | Out-Null
					  Copy-Item "$(Split-Path $qemu)\*" resources/qemu -Recurse -Force
			- name: Build portable Windows app
				run: npm run desktop:build:windows
			- name: Upload Windows executable to release
				uses: softprops/action-gh-release@v2
				with:
					files: dist/XDVM-*-win-x64.exe
					generate_release_notes: false
